<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyectos | LearnTrack</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/recursos/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/app/comun/tema-inicial.js"></script>
    <link rel="stylesheet" href="/comun/base.css">
    <link rel="stylesheet" href="/app/comun/temas.css">
    <link rel="stylesheet" href="/app/comun/privado.css">
    <link rel="stylesheet" href="/app/componentes/barra-navegacion/barra-navegacion.css">
    <link rel="stylesheet" href="/app/comun/actividades.css">
    <link rel="stylesheet" href="/app/proyectos/proyectos.css">
    <script type="module" src="/app/proyectos/proyectos.js"></script>
</head>
<body class="zona-privada pagina-proyectos">
    <header class="site-header">
        <div class="header-inner">
            <div class="header-grupo-izquierdo">
                <!-- Avatar (perfil, cambiar de cuenta, cerrar sesión y festivos) y engranaje (Configuración):
                     los monta componentes/barra-navegacion/barra-navegacion.js -->
                <div class="barra-cuenta" id="barra-cuenta"></div>
                <a class="brand" href="/">
                    <img src="/recursos/favicon.svg" alt="LearnTrack" class="logo-img">
                </a>
                <nav aria-label="Navegación principal">
                    <ul>
                        <li><a href="/panel">Mi panel</a></li>
                        <li><a href="/calendario">Mi agenda</a></li>
                        <li><a href="/proyectos" class="active" aria-current="page">Proyectos</a></li>
                    </ul>
                </nav>
            </div>
            <span class="saludo-usuario" id="saludo-usuario"></span>
        </div>
    </header>

    <main id="contenido" class="proyectos-app">
        <div class="proyectos-cabecera">
            <div>
                <h1>Proyectos</h1>
                <p class="proyectos-sub">Elige un proyecto y sigue el avance de sus subtareas en Kanban o en línea de tiempo.</p>
            </div>
        </div>

        <div class="proyectos-layout">
            <aside class="proyectos-lista card" aria-labelledby="lista-titulo">
                <h2 id="lista-titulo">Tus proyectos</h2>
                <ul id="lista-proyectos" class="lista-proyectos"></ul>
            </aside>

            <section class="proyectos-detalle card" aria-live="polite">
                <p id="detalle-vacio" class="vacio">Selecciona un proyecto para ver sus tareas.</p>
                <div id="detalle-proyecto" hidden>
                    <div class="detalle-cabecera">
                        <div>
                            <h2 id="proyecto-titulo"></h2>
                            <p id="proyecto-resumen" class="proyecto-resumen"></p>
                        </div>
                        <div class="detalle-acciones">
                            <div class="selector-modo" role="group" aria-label="Forma de ver el proyecto">
                                <button type="button" class="boton" data-modo="kanban" aria-pressed="true">▦ Kanban</button>
                                <button type="button" class="boton" data-modo="timeline" aria-pressed="false">▤ Línea de tiempo</button>
                            </div>
                            <button type="button" class="boton boton-primario" id="btn-nueva-tarea">+ Tarea</button>
                        </div>
                    </div>
                    <div class="proyecto-progreso">
                        <div class="barra-progreso" id="proyecto-progreso-rol" role="progressbar" aria-labelledby="proyecto-titulo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <i id="proyecto-progreso"></i>
                        </div>
                        <strong id="proyecto-progreso-texto">0 %</strong>
                    </div>
                    <div id="vista-proyecto" class="vista-proyecto"></div>
                </div>
            </section>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 LearnTrack. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
